<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0f" />
  <meta name="description" content="Salomon Owona — projects, brands and apps." />
  <title>Salomon Owona — Links</title>
  <style>
    :root {
      --bg: #0b0c0f;
      --surface: #14161c;
      --surface-hover: #1b1e27;
      --border: rgba(255,255,255,0.08);
      --text: #f4f5f7;
      --muted: #9aa3b2;
      --accent: #7dd3fc;
      --radius: 20px;
      --gap: 14px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      justify-content: center;
      padding: 28px 18px calc(40px + var(--safe-bottom));
    }
    .shell {
      width: min(720px, 100%);
    }
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      margin-bottom: 28px;
      position: relative;
    }
    .lang {
      position: absolute;
      top: 0;
      right: 0;
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(20,22,28,0.9);
      backdrop-filter: blur(8px);
    }
    .lang button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: 600 12px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      letter-spacing: 0.04em;
      padding: 8px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .lang button[aria-pressed="true"] {
      background: #fff;
      color: #0b0c0f;
    }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 8px 0 0;
      font-size: clamp(1.45rem, 4vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .claim {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
      max-width: 28ch;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 148px;
      padding: 18px 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .card:hover, .card:focus-visible {
      background: var(--surface-hover);
      border-color: rgba(255,255,255,0.16);
      outline: none;
    }
    .card:active { transform: scale(0.98); }
    .card.is-soon {
      cursor: default;
      opacity: 0.92;
    }
    .logo-wrap {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #0b0c0f;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .logo-wrap img {
      max-width: 86%;
      max-height: 86%;
      object-fit: contain;
      display: block;
    }
    .logo-wrap.badge {
      width: 100%;
      max-width: 168px;
      height: 64px;
      background: #f5f5f7;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 8px 10px;
    }
    .logo-wrap.badge img {
      max-width: 100%;
      max-height: 48px;
      width: auto;
    }
    .label {
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-align: center;
    }
    .sub {
      margin-top: -6px;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.35;
      min-height: 2.7em;
    }
    .soon {
      display: inline-block;
      margin-top: 2px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    footer {
      margin-top: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="sw" aria-pressed="false">SW</button>
      </div>
      <img class="avatar" src="assets/salomon.jpg" alt="Salomon Owona" width="88" height="88" />
      <h1>Salomon Owona</h1>
      <p class="claim" data-i18n="claim">Digital Architect &amp; Gründer</p>
    </header>

    <main class="grid" aria-label="Projects">
      <a class="card" href="https://ndasi.com/" rel="noopener noreferrer">
        <div class="logo-wrap"><img src="assets/ndasi.jpg" alt="NDASI logo" /></div>
        <div class="label">NDASI</div>
        <div class="sub" data-i18n="ndasi">Premium-Baustoffe · Kamerun</div>
      </a>

      <a class="card" href="https://cmrec.ndasi.com/" rel="noopener noreferrer">
        <div class="logo-wrap"><img src="assets/cmrec.jpg" alt="CMREC" /></div>
        <div class="label">cmrec</div>
        <div class="sub" data-i18n="cmrec">Solare Videoüberwachung · Miete</div>
      </a>

      <a class="card" href="https://www.owona.de/" rel="noopener noreferrer">
        <div class="logo-wrap"><img src="assets/om.png" alt="Owona Media" /></div>
        <div class="label">OM</div>
        <div class="sub" data-i18n="om">Owona Media · Digital Agency</div>
      </a>

      <a class="card" href="https://salomonowona.com/" rel="noopener noreferrer">
        <div class="logo-wrap"><img src="assets/salomon.jpg" alt="salomonowona.com" style="border-radius:50%;max-width:78%;max-height:78%;" /></div>
        <div class="label">salomonowona.com</div>
        <div class="sub" data-i18n="so">Persönliche Seite</div>
      </a>

      <div class="card is-soon" role="group" aria-label="CMRide App Store">
        <div class="logo-wrap badge"><img src="assets/appstore.svg" alt="Download on the App Store" /></div>
        <div class="label">CMRide</div>
        <div class="sub"><span data-i18n="appstore">App Store</span><br /><span class="soon" data-i18n="soon">folgt in Kürze</span></div>
      </div>

      <div class="card is-soon" role="group" aria-label="CMRide Google Play">
        <div class="logo-wrap badge"><img src="assets/playstore.svg" alt="Get it on Google Play" /></div>
        <div class="label">CMRide</div>
        <div class="sub"><span data-i18n="playstore">Google Play</span><br /><span class="soon" data-i18n="soon">folgt in Kürze</span></div>
      </div>
    </main>

    <footer data-i18n="footer">Zentrale Link-Seite für Visitenkarte &amp; QR</footer>
  </div>

  <script>
    const i18n = {
      de: {
        claim: "Digital Architect & Gründer",
        ndasi: "Premium-Baustoffe · Kamerun",
        cmrec: "Solare Videoüberwachung · Miete",
        om: "Owona Media · Digital Agency",
        so: "Persönliche Seite",
        appstore: "App Store",
        playstore: "Google Play",
        soon: "folgt in Kürze",
        footer: "Zentrale Link-Seite für Visitenkarte & QR"
      },
      en: {
        claim: "Digital Architect & Founder",
        ndasi: "Premium building materials · Cameroon",
        cmrec: "Solar video surveillance · rental",
        om: "Owona Media · Digital Agency",
        so: "Personal site",
        appstore: "App Store",
        playstore: "Google Play",
        soon: "coming soon",
        footer: "Central link page for business card & QR"
      },
      sw: {
        claim: "Mbunifu wa Dijitali & Mwanzilishi",
        ndasi: "Vifaa bora vya ujenzi · Kameruni",
        cmrec: "Ukodishaji wa kamera za jua",
        om: "Owona Media · Wakala wa Dijitali",
        so: "Ukurasa binafsi",
        appstore: "App Store",
        playstore: "Google Play",
        soon: "inakuja hivi karibuni",
        footer: "Ukurasa wa viungo kwa kadi ya biashara & QR"
      }
    };

    function setLang(lang) {
      const dict = i18n[lang] || i18n.de;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (dict[key]) el.textContent = dict[key];
      });
      document.querySelectorAll(".lang button").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.dataset.lang === lang ? "true" : "false");
      });
      try { localStorage.setItem("so-hub-lang", lang); } catch (_) {}
    }

    document.querySelectorAll(".lang button").forEach((btn) => {
      btn.addEventListener("click", () => setLang(btn.dataset.lang));
    });

    let start = "de";
    try {
      const saved = localStorage.getItem("so-hub-lang");
      if (saved && i18n[saved]) start = saved;
      else {
        const nav = (navigator.language || "de").toLowerCase();
        if (nav.startsWith("sw")) start = "sw";
        else if (nav.startsWith("en")) start = "en";
      }
    } catch (_) {}
    setLang(start);
  </script>
</body>
</html>
